<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBS AI Academy – Interest Form</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== EDIT YOUR OFFERINGS IN THE SCRIPT AT THE BOTTOM (OFFERINGS list) ===== */
  :root{
    --navy:#06123a; --navy2:#0b1f5c; --blue:#1565e8; --blue-lt:#3d8bff; --ice:#e8f0ff;
    --text:#0b1636; --muted:#5a6684; --line:#d5def0; --ok:#12a150;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Montserrat,"Segoe UI",Arial,sans-serif;min-height:100vh;color:var(--text);
    background:radial-gradient(ellipse at top left,#1a3c9e 0%,var(--navy2) 35%,var(--navy) 80%);
    display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px}
  header{text-align:center;margin-bottom:22px}
  header img{width:min(420px,80vw);height:auto}
  header h1{color:#fff;font-size:clamp(20px,3vw,30px);font-weight:700;margin-top:14px}
  header p{color:#b9c8ee;font-size:15px;margin-top:6px}
  .card{background:#fff;border-radius:18px;width:100%;max-width:820px;padding:34px 38px;
    box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:640px){.row{grid-template-columns:1fr}.card{padding:24px 20px}}
  label.f{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
  .req{color:var(--blue)}
  input[type=text],input[type=email],textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;
    border:1.5px solid var(--line);border-radius:10px;outline:none;transition:border .15s,box-shadow .15s}
  input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(21,101,232,.15)}
  .field{margin-bottom:18px}
  h2{font-size:16px;font-weight:700;margin:8px 0 4px}
  .hint{font-size:13px;color:var(--muted);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);
    border-radius:12px;cursor:pointer;transition:all .15s;user-select:none}
  .opt:hover{border-color:var(--blue-lt)}
  .opt input{position:absolute;opacity:0}
  .box{flex:0 0 22px;height:22px;border:2px solid #9fb0d4;border-radius:6px;margin-top:1px;display:grid;place-items:center;transition:all .15s}
  .box svg{width:14px;height:14px;opacity:0}
  .opt.on{border-color:var(--blue);background:var(--ice)}
  .opt.on .box{background:var(--blue);border-color:var(--blue)}
  .opt.on .box svg{opacity:1}
  .opt b{display:block;font-size:14.5px;font-weight:600}
  .opt span.d{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:6px 0 22px;cursor:pointer}
  .consent input{margin-top:3px;width:18px;height:18px;accent-color:var(--blue)}
  button.go{width:100%;font:inherit;font-weight:700;font-size:17px;color:#fff;border:0;border-radius:12px;padding:16px;
    background:linear-gradient(90deg,var(--blue),var(--blue-lt));cursor:pointer;transition:transform .1s,filter .15s}
  button.go:hover{filter:brightness(1.08)} button.go:active{transform:scale(.99)}
  .err{color:#c62828;font-size:13px;margin-top:10px;text-align:center;min-height:18px}
  .thanks{display:none;text-align:center;padding:40px 10px}
  .thanks .tick{width:84px;height:84px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto 18px}
  .thanks h2{font-size:26px} .thanks p{color:var(--muted);margin-top:8px}
  /* admin */
  #adminBtn{position:fixed;right:12px;bottom:10px;background:transparent;border:0;color:rgba(255,255,255,.25);font:inherit;font-size:12px;cursor:pointer}
  #adminBtn:hover{color:rgba(255,255,255,.7)}
  #admin{display:none;position:fixed;inset:0;background:rgba(3,10,35,.7);align-items:center;justify-content:center;padding:16px;z-index:9}
  #admin .panel{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:85vh;display:flex;flex-direction:column;padding:24px}
  #admin h3{font-size:18px;margin-bottom:4px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  .tools button{font:inherit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:9px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
  .tools button.pri{background:var(--blue);color:#fff}
  .tools button.danger{border-color:#c62828;color:#c62828}
  .tbl{overflow:auto;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:var(--ice);position:sticky;top:0}
  .stats{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
  .stats span{background:var(--ice);border-radius:20px;padding:4px 10px}
</style>
</head>

0CZV1U/z7ec6kbbAQTe7kzBit7bz7SWO3j2SxROe5VXy5atGjRokWLFi0anY/Wl7Oar0fr2ftZ8qxltIl9n/tqtBWKFi1atGjRokWLFi1atGjRokWLFi1atGjRokWLFi1atGjRusz+HynbXcbFJcDxAAAAAElFTkSuQmCC" alt="GBS AI Academy">
  <h1>Explore AI with GBS in 2027</h1>
  <p>Tell us what interests you and our team will be in touch.</p>
</header>

<div class="card">
  <form id="form" novalidate>
    <div class="field">
      <label class="f" for="company">Company name <span class="req">*</span></label>
      <input type="text" id="company" autocomplete="off">
    </div>
    <div class="row">
      <div class="field">
        <label class="f" for="name">Name <span class="req">*</span></label>
        <input type="text" id="name" autocomplete="off">
      </div>
      <div class="field">
        <label class="f" for="surname">Surname <span class="req">*</span></label>
        <input type="text" id="surname" autocomplete="off">
      </div>
    </div>
    <div class="field">
      <label class="f" for="email">Email address <span class="req">*</span></label>
      <input type="email" id="email" autocomplete="off" placeholder="name@company.co.za">
    </div>

    <h2>What are you interested in? <span class="req">*</span></h2>
    <p class="hint">Select all that apply.</p>
    <div class="grid" id="opts"></div>

    <div class="field">
      <label class="f" for="notes">Anything else? <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <textarea id="notes" rows="2" placeholder="e.g. team size, timing, specific challenge"></textarea>
    </div>

    <label class="consent">
      <input type="checkbox" id="consent">
      <span>I agree that GBS may use these details to contact me about its AI offerings, in line with POPIA. <span class="req">*</span></span>
    </label>

    <button type="submit" class="go">Submit my interest</button>
    <div class="err" id="err"></div>
  </form>

  <div class="thanks" id="thanks">
    <div class="tick"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Thank you!</h2>
    <p>We've got your details — the GBS team will be in touch soon.</p>
  </div>
</div>

<button id="adminBtn" title="Admin">● admin</button>

<div id="admin">
  <div class="panel">
    <h3>Submissions (<span id="count">0</span>)</h3>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <button class="pri" id="exp">Download CSV (Excel)</button>
      <button class="danger" id="clr">Clear all</button>
      <button id="close">Close</button>
    </div>
    <div class="tbl"><table id="tbl"></table></div>
  </div>
</div>

<script>
/* ======= EDIT YOUR OFFERINGS HERE ======= */
const OFFERINGS = [
  ["AI Training – Fundamentals", "Hands-on AI skills for staff and teams"],
  ["AI Training – Leadership", "AI strategy & adoption for executives and managers"],
  ["Custom AI Agents", "Bespoke chatbots/agents (Voiceflow, Copilot Studio)"],
  ["Microsoft Copilot Enablement", "Getting real value from Copilot in M365"],
  ["AI Policy & Governance", "AI policy aligned with POPIA and SA law"],
  ["CCMA Rules Assistant", "AI help for employers on CCMA rules & processes"],
  ["EE Navigator", "Employment Equity planning & compliance tool"],
  ["AARTO Compliance Tool", "Fleet and driver AARTO compliance"],
  ["DE Bot", "AI assistant for skills development & training admin"],
  ["AI Strategy & Consulting", "Roadmap, use-case discovery and integration"]
];
const STORE_KEY = "gbs_ai_interest_2027";
/* ======================================== */

const $ = id => document.getElementById(id);
const tickSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

$("opts").innerHTML = OFFERINGS.map(([t,d],i)=>
  `<label class="opt"><input type="checkbox" value="${t}"><div class="box">${tickSvg}</div><div><b>${t}</b><span class="d">${d}</span></div></label>`).join("");
document.querySelectorAll(".opt input").forEach(cb=>cb.addEventListener("change",e=>e.target.closest(".opt").classList.toggle("on",e.target.checked)));

function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ return memory; } }
let memory = [];
function save(list){ memory = list; try{ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }catch(e){} }

$("form").addEventListener("submit", e=>{
  e.preventDefault();
  const v = {
    company: $("company").value.trim(), name: $("name").value.trim(),
    surname: $("surname").value.trim(), email: $("email").value.trim(),
    interests: [...document.querySelectorAll(".opt input:checked")].map(c=>c.value),
    notes: $("notes").value.trim()
  };
  let msg = "";
  if(!v.company || !v.name || !v.surname || !v.email) msg = "Please fill in company, name, surname and email.";
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) msg = "Please enter a valid email address.";
  else if(!v.interests.length) msg = "Please select at least one area of interest.";
  else if(!$("consent").checked) msg = "Please tick the consent box to continue.";
  $("err").textContent = msg;
  if(msg) return;

  v.timestamp = new Date().toLocaleString("en-ZA");
  const list = load(); list.push(v); save(list);

  $("form").style.display="none"; $("thanks").style.display="block";
  setTimeout(()=>{
    $("form").reset(); document.querySelectorAll(".opt").forEach(o=>o.classList.remove("on"));
    $("err").textContent=""; $("thanks").style.display="none"; $("form").style.display="block";
    window.scrollTo(0,0); $("company").focus();
  }, 3500);
});

/* ---- admin ---- */
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const list = load();
  $("count").textContent = list.length;
  const tally = {}; OFFERINGS.forEach(([t])=>tally[t]=0);
  list.forEach(r=>r.interests.forEach(i=>tally[i]=(tally[i]||0)+1));
  $("stats").innerHTML = Object.entries(tally).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<span>${esc(k)}: <b>${n}</b></span>`).join("");
  $("tbl").innerHTML = "<tr><th>Time</th><th>Company</th><th>Name</th><th>Surname</th><th>Email</th><th>Interests</th><th>Notes</th></tr>" +
    list.slice().reverse().map(r=>`<tr><td>${esc(r.timestamp)}</td><td>${esc(r.company)}</td><td>${esc(r.name)}</td><td>${esc(r.surname)}</td><td>${esc(r.email)}</td><td>${esc(r.interests.join("; "))}</td><td>${esc(r.notes)}</td></tr>`).join("");
}
$("adminBtn").onclick = ()=>{ render(); $("admin").style.display="flex"; };
$("close").onclick = ()=> $("admin").style.display="none";
$("exp").onclick = ()=>{
  const list = load();
  const q = s => '"' + String(s ?? "").replace(/"/g,'""') + '"';
  const head = ["Timestamp","Company","Name","Surname","Email","Notes", ...OFFERINGS.map(o=>o[0]), "All interests"];
  const rows = list.map(r=>[r.timestamp,r.company,r.name,r.surname,r.email,r.notes,
    ...OFFERINGS.map(([t])=>r.interests.includes(t)?"Yes":""), r.interests.join("; ")].map(q).join(","));
  const csv = "﻿" + [head.map(q).join(","), ...rows].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "GBS_AI_Interest_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
};
$("clr").onclick = ()=>{
  if(confirm("Delete ALL submissions from this laptop? Download the CSV first!")){ save([]); render(); }
};
</script>
</body>
</html>
